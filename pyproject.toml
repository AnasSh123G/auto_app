[project]
name = "autoapp"
version = "0.1.0"
description = "Local CLI that finds German job listings, evaluates them against your CV, prepares application folders and sends email applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.26.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
]

[project.scripts]
autoapp = "autoapp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapp"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: needs Playwright Chromium",
    "live(env): calls a real external API; skipped unless the named environment variable is set",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
