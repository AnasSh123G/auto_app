<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Bewerbung (mehrstufig)</title></head>
<body>
  <form id="wizard" action="#" method="post">
    <fieldset id="step1">
      <legend>Schritt 1: Persönliche Daten</legend>
      <p><label for="vorname">Vorname</label> <input id="vorname" name="vorname" type="text" required></p>
      <p><label for="nachname">Nachname</label> <input id="nachname" name="nachname" type="text" required></p>
      <p><label for="email">E-Mail</label> <input id="email" name="email" type="email" required></p>
      <p><button type="button" id="weiter"
           onclick="document.getElementById('step1').hidden = true; document.getElementById('step2').hidden = false;">Weiter</button></p>
    </fieldset>
    <fieldset id="step2" hidden>
      <legend>Schritt 2: Unterlagen</legend>
      <p><label for="gehalt">Gehaltsvorstellung</label> <input id="gehalt" name="gehalt" type="text"></p>
      <p><label for="lebenslauf">Lebenslauf</label> <input id="lebenslauf" name="lebenslauf" type="file"></p>
      <p><input id="dsgvo" name="dsgvo" type="checkbox" required> <label for="dsgvo">Ich stimme der Verarbeitung meiner Daten zu</label></p>
      <p><button type="submit" id="submit">Absenden</button></p>
    </fieldset>
  </form>
  <script>
  // Submit listener: counts every submit event and blocks navigation.
  window.__submits = 0;
  document.addEventListener("submit", function (e) { window.__submits += 1; e.preventDefault(); }, true);
</script>
</body>
</html>
