<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Careers (iframe host)</title></head>
<body>
  <h1>Careers</h1>
  <p>Apply for this position below.</p>
  <iframe id="ats" src="iframe_form.html" width="700" height="700" title="Application form"></iframe>
  <script>
  // Submit listener: counts every submit event and blocks navigation.
  window.__submits = 0;
  document.addEventListener("submit", function (e) { window.__submits += 1; e.preventDefault(); }, true);
</script>
</body>
</html>
