<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Bewerbung (ein Upload)</title></head>
<body>
  <form id="apply" action="#" method="post">
    <p><label for="vorname">Vorname</label> <input id="vorname" name="vorname" type="text"></p>
    <p><label for="nachname">Nachname</label> <input id="nachname" name="nachname" type="text"></p>
    <p><label for="mappe">Bewerbungsunterlagen (PDF)</label> <input id="mappe" name="mappe" type="file" accept="application/pdf"></p>
    <p><button type="submit">Bewerben</button></p>
  </form>
  <script>
  // Submit listener: counts every submit event and blocks navigation.
  window.__submits = 0;
  document.addEventListener("submit", function (e) { window.__submits += 1; e.preventDefault(); }, true);
</script>
</body>
</html>
