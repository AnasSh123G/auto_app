<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ATS form</title></head>
<body>
  <form id="ats-form" action="#" method="post">
    <p><label for="fn">First name</label> <input id="fn" name="first_name" type="text" required></p>
    <p><label for="ln">Last name</label> <input id="ln" name="last_name" type="text" required></p>
    <p><label for="em">Email</label> <input id="em" name="email" type="email" required></p>
    <p><label for="ph">Phone</label> <input id="ph" name="phone" type="tel"></p>
    <p><label for="sal">Salary expectation</label> <input id="sal" name="salary" type="text"></p>
    <p><label for="why">Why do you want to work with us?</label> <textarea id="why" name="why" maxlength="500"></textarea></p>
    <p><label for="resume">Resume</label> <input id="resume" name="resume" type="file"></p>
    <p><label for="country">Country</label>
       <select id="country" name="country">
         <option value="">Please select</option>
         <option value="DE">Germany</option>
         <option value="AT">Austria</option>
       </select></p>
    <p><input id="terms" name="terms" type="checkbox" required> <label for="terms">I agree to the terms</label></p>
    <p><button type="submit">Submit application</button></p>
  </form>
  <script>
  // Submit listener: counts every submit event and blocks navigation.
  window.__submits = 0;
  document.addEventListener("submit", function (e) { window.__submits += 1; e.preventDefault(); }, true);
</script>
</body>
</html>
